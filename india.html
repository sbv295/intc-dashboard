    // ─── Fetch Stock Data ───────────────────────────────────────────────────
    async function fetchIndiaStock(stock) {
        try {
            const url = `${YAHOO_BASE}${stock.ticker}?interval=1m&range=2d`;
            const json = await yahooFetch(url);
            const result = json.chart.result[0];
            const meta = result.meta;
            const timestamps = result.timestamp || [];
            const quote = result.indicators.quote[0];

            const ms = getIndiaMarketStatus();
            const prevClose = meta.previousClose;
            const regPrice = meta.regularMarketPrice;

            state[stock.ticker].sessionClose = regPrice || prevClose;
            state[stock.ticker].prevClose = prevClose;

            // NSE/BSE returns meta.tradingPeriods as a flat array of daily {start,end}
            // session windows (unlike the US/KRX {pre,regular,post} object-of-arrays shape),
            // and meta.currentTradingPeriod can point at the *next* (not yet open) session
            // while the market is closed. Pick whichever candidate window actually contains
            // the most recent candle with data — that's always the correct "today" session.
            const rawTP = meta.tradingPeriods;
            const tpCandidates = [];
            if (Array.isArray(rawTP)) {
                rawTP.forEach(entry => {
                    const e = Array.isArray(entry) ? entry[0] : entry;
                    if (e && e.start != null && e.end != null) tpCandidates.push({ start: e.start, end: e.end });
                });
            }
            if (meta.currentTradingPeriod && meta.currentTradingPeriod.regular) {
                tpCandidates.push(meta.currentTradingPeriod.regular);
            }
            let lastValidTs = null;
            for (let i = timestamps.length - 1; i >= 0; i--) {
                if (quote.close[i] != null) { lastValidTs = timestamps[i]; break; }
            }
            let regularWindow = (lastValidTs != null)
                ? tpCandidates.find(c => lastValidTs >= c.start && lastValidTs <= c.end)
                : null;
            if (!regularWindow) {
                const nowSec = Date.now() / 1000;
                const started = tpCandidates.filter(c => c.start <= nowSec).sort((a, b) => b.start - a.start);
                regularWindow = started[0] || tpCandidates[tpCandidates.length - 1] || null;
            }
            const tp = regularWindow ? { regular: regularWindow } : null;

            let regularClose = null;
            if (tp) {
                for (let i = timestamps.length - 1; i >= 0; i--) {
                    const t = timestamps[i], c = quote.close[i];
                    if (c != null && t >= tp.regular.start && t <= tp.regular.end) { regularClose = c; break; }
                }
            }

            if (tp && tp.regular) {
                const series = [];
                for (let i = 0; i < timestamps.length; i++) {
                    const t = timestamps[i], c = quote.close[i];
                    if (c != null && t >= tp.regular.start && t <= tp.regular.end) series.push({ t, c });
                }
                if (series.length) {
                    state[stock.ticker].chartSeries = series;
                    state[stock.ticker].chartRange = { start: tp.regular.start, end: tp.regular.end };
                }
            }

            const displayPrice = regPrice || regularClose;

            const _sid = sid(stock);
            const priceEl = document.getElementById(`nasdaq-${_sid}`);
            if (displayPrice) {
                const prev = state[stock.ticker].prevPrice;
                if (prev !== null && displayPrice !== prev) {
                    priceEl.classList.remove('price-flash-up', 'price-flash-down');
                    void priceEl.offsetWidth;
                    priceEl.classList.add(displayPrice > prev ? 'price-flash-up' : 'price-flash-down');
                }
                state[stock.ticker].prevPrice = displayPrice;
                state[stock.ticker].price = displayPrice;
                priceEl.textContent = fmtPrice(stock, displayPrice);
                updateMarketCap(stock.ticker);

                const chgEl = document.getElementById(`nasdaq-chg-${_sid}`);
                const refClose = state[stock.ticker].prevClose;
                if (refClose) {
                    const chg = displayPrice - refClose;
                    const pct = (chg / refClose) * 100;
                    const sign = chg >= 0 ? '+' : '';
                    chgEl.innerHTML = `<span class="prev-ref">${fmtPrice(stock, refClose)}</span> <span class="${chg >= 0 ? 'up' : 'down'}">${sign}${pct.toFixed(2)}%</span>`;
                    chgEl.className = `price-block-change`;
                    if (ms === 'market') updateSentiment(stock.ticker, pct);
                }
            }

            const metaVolume = meta.regularMarketVolume;
            if (metaVolume) {
                state[stock.ticker].volume = metaVolume;
                displayVolume(stock.ticker, metaVolume);
            }
            if (tp && quote.volume) {
                let totalVol = 0;
                let regOpen = null, regHigh = -Infinity, regLow = Infinity;
                for (let i = 0; i < timestamps.length; i++) {
                    const t = timestamps[i], v = quote.volume[i];
                    const o = quote.open[i], h = quote.high[i], l = quote.low[i];
                    if (t >= tp.regular.start && t <= tp.regular.end) {
                        if (v) totalVol += v;
                        if (regOpen === null && o != null) regOpen = o;
                        if (h != null) regHigh = Math.max(regHigh, h);
                        if (l != null) regLow = Math.min(regLow, l);
                    }
                }

                if (!metaVolume && totalVol > 0) {
                    state[stock.ticker].volume = totalVol;
                    displayVolume(stock.ticker, totalVol);
                }
                const ohlEl = document.getElementById(`ohl-${_sid}`);
                if (ohlEl && regOpen !== null && regHigh !== -Infinity) {
                    const refClosePct = state[stock.ticker].prevClose;
                    const ohlPct = (v) => {
                        if (refClosePct == null || v == null) return '';
                        const pct = ((v - refClosePct) / refClosePct) * 100;
                        const sign = pct >= 0 ? '+' : '';
                        return `<span class="ohl-pct ${pct >= 0 ? 'up' : 'down'}">(${sign}${pct.toFixed(1)}%)</span>`;
                    };
                    const ohlGroup = (label, v) => `<span class="ohl-group"><span class="ohl-label">${label}</span><span class="ohl-value">${fmtPrice(stock, v)}</span>${ohlPct(v)}</span>`;
                    ohlEl.innerHTML = ohlGroup('O', regOpen) + ohlGroup('H', regHigh) + ohlGroup('L', regLow);
                    fitOhlRow(ohlEl);
                }
            }

            if (state[stock.ticker].chartSeries) {
                const sentimentEl = document.getElementById(`sentiment-${_sid}`);
                if (sentimentEl) sentimentEl.classList.add('visible');
                drawSentimentChart(stock.ticker);
            }

            renderWeekReadout(stock);
        } catch (e) {
            // Silent fail
        }
    }

    async function fetchAllIndia() {
        await Promise.allSettled(STOCKS.map(s => fetchIndiaStock(s)));
    }

    // ─── Yahoo WebSocket (live prices) ──────────────────────────────────────
    const YahooProto = `
        syntax = "proto3";
        message PricingData {
            string id = 1;
            float price = 2;
            int64 time = 3;
            string exchange = 4;
            string quoteType = 5;
            float changePercent = 8;
            float dayVolume = 9;
            float dayHigh = 10;
            float dayLow = 11;
            float change = 12;
            float previousClose = 15;
            string marketHours = 20;
        }
    `;
    let yahooRoot, YahooPricingData, yahooWs;

    function initYahooProto() {
        yahooRoot = protobuf.parse(YahooProto).root;
        YahooPricingData = yahooRoot.lookupType('PricingData');
    }

    function connectYahooWs() {
        if (yahooWs && yahooWs.readyState === WebSocket.OPEN) return;
        yahooWs = new WebSocket('wss://streamer.finance.yahoo.com/');
        yahooWs.onopen = () => {
            const tickers = STOCKS.map(s => s.ticker);
            yahooWs.send(JSON.stringify({ subscribe: tickers }));
        };
        yahooWs.onmessage = (event) => {
            try {
                const bytes = Uint8Array.from(atob(event.data), c => c.charCodeAt(0));
                const decoded = YahooPricingData.decode(bytes);
                if (decoded.price && decoded.price > 0 && decoded.id) {
                    updateYahooPrice(decoded.id, decoded.price);
                }
            } catch (e) {}
        };
        yahooWs.onclose = () => setTimeout(connectYahooWs, 5000);
        yahooWs.onerror = () => yahooWs.close();
    }

    function updateYahooPrice(ticker, price) {
        const st = state[ticker];
        if (!st) return;
        const stock = STOCKS.find(s => s.ticker === ticker);
        if (!stock) return;

        const ms = getIndiaMarketStatus();
        if (ms === 'closed') return;

        const _sid = sid(stock);
        const priceEl = document.getElementById(`nasdaq-${_sid}`);
        if (!priceEl) return;
        const prev = st.prevPrice;
        if (prev !== null && price !== prev) {
            priceEl.classList.remove('price-flash-up', 'price-flash-down');
            void priceEl.offsetWidth;
            priceEl.classList.add(price > prev ? 'price-flash-up' : 'price-flash-down');
        }
        st.prevPrice = price;
        st.price = price;
        priceEl.textContent = fmtPrice(stock, price);
        updateMarketCap(ticker);

        if (st.chartRange) {
            const nowSec = Math.floor(Date.now() / 1000);
            if (nowSec >= st.chartRange.start && nowSec <= st.chartRange.end) {
                if (!st.chartSeries) st.chartSeries = [];
                st.chartSeries.push({ t: nowSec, c: price });
            }
        }

        const chgEl = document.getElementById(`nasdaq-chg-${_sid}`);
        const prevClose = st.prevClose;
        if (prevClose && chgEl) {
            const chg = price - prevClose;
            const pct = (chg / prevClose) * 100;
            const sign = chg >= 0 ? '+' : '';
            chgEl.innerHTML = `<span class="prev-ref">${fmtPrice(stock, prevClose)}</span> <span class="${chg >= 0 ? 'up' : 'down'}">${sign}${pct.toFixed(2)}%</span>`;
            chgEl.className = `price-block-change`;
            updateSentiment(ticker, pct);
        }
        renderWeekReadout(stock);
    }

    // ─── Fetch Shares Outstanding / Fundamentals ────────────────────────────
    async function fetchAllShares() {
        await Promise.allSettled(STOCKS.map(async (stock) => {
            for (let attempt = 0; attempt < 2; attempt++) {
                try {
                    const url = `https://query1.finance.yahoo.com/v10/finance/quoteSummary/${stock.ticker}?modules=defaultKeyStatistics,summaryDetail,calendarEvents,financialData,earnings`;
                    const json = await yahooFetch(url);
                    const result = json.quoteSummary?.result?.[0];
                    const mcapRaw = result?.summaryDetail?.marketCap?.raw || result?.summaryDetail?.nonDilutedMarketCap?.raw;
                    const shares = result?.defaultKeyStatistics?.sharesOutstanding?.raw;
                    if (shares) {
                        state[stock.ticker].shares = shares;
                        updateMarketCap(stock.ticker);
                    } else if (mcapRaw && state[stock.ticker].price) {
                        state[stock.ticker].shares = mcapRaw / state[stock.ticker].price;
                        updateMarketCap(stock.ticker);
                    } else if (mcapRaw) {
                        state[stock.ticker].mcap = mcapRaw;
                        displayMarketCap(stock.ticker, mcapRaw);
                    }
                    const avgVol = result?.summaryDetail?.averageVolume?.raw;
                    if (avgVol) displayAvgVolume(stock.ticker, avgVol);

                    const _sid = sid(stock);

                    const earningsDates = result?.calendarEvents?.earnings?.earningsDate;
                    const earningsEl = document.getElementById(`earningsdate-${_sid}`);
                    if (earningsEl && earningsDates && earningsDates.length > 0) {
                        const now = Date.now() / 1000;
                        const upcoming = earningsDates.filter(d => d.raw > now - 86400);
                        if (upcoming.length > 0) {
                            const d = new Date(upcoming[0].raw * 1000);
                            const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
                            const yy = String(d.getFullYear()).slice(2);
                            earningsEl.innerHTML = `<span class="ed-label">Earnings</span><span class="ed-value">${d.getDate()} ${MONTHS[d.getMonth()]} ${yy}</span>`;
                            earningsEl.dataset.earningsRaw = upcoming[0].raw;
                            updateEarningsCountdowns();
                        }
                    }

                    const trailingPE = result?.summaryDetail?.trailingPE?.raw;
                    const forwardPE  = result?.summaryDetail?.forwardPE?.raw;
                    const pegRatio   = result?.defaultKeyStatistics?.pegRatio?.raw;
                    const targetPrice = result?.financialData?.targetMeanPrice?.raw;
                    const fundamentalsEl = document.getElementById(`fundamentals-${_sid}`);
                    if (fundamentalsEl) {
                        const parts = [];
                        if (trailingPE != null && isFinite(trailingPE)) parts.push(`<span class="fund-label">PE(TTM)</span> <span class="fund-value">${trailingPE.toFixed(1)}</span>`);
                        if (forwardPE  != null && isFinite(forwardPE))  parts.push(`<span class="fund-label">PE(Fwd)</span> <span class="fund-value">${forwardPE.toFixed(1)}</span>`);
                        if (targetPrice != null) {
                            parts.push(`<span class="fund-label">Target</span> <span class="fund-target">${fmtPrice1(stock, targetPrice)}</span>`);
                        }
                        if (parts.length > 0) fundamentalsEl.innerHTML = parts.join(' · ');
                    }

                    const beta = result?.defaultKeyStatistics?.beta?.raw ?? result?.summaryDetail?.beta?.raw;
                    const priceToBook = result?.defaultKeyStatistics?.priceToBook?.raw;
                    const recKey = result?.financialData?.recommendationKey;
                    const riskEl = document.getElementById(`risk-${_sid}`);
                    if (riskEl) {
                        const riskParts = [];
                        if (beta != null && isFinite(beta)) riskParts.push(`<span class="fund-label" style="text-transform:none">β</span> <span class="fund-value">${beta.toFixed(2)}</span>`);
                        if (pegRatio != null && isFinite(pegRatio)) riskParts.push(`<span class="fund-label">PEG</span> <span class="fund-value">${pegRatio.toFixed(2)}</span>`);
                        if (priceToBook != null && isFinite(priceToBook)) riskParts.push(`<span class="fund-label">P/B</span> <span class="fund-value">${priceToBook.toFixed(1)}</span>`);
                        if (recKey && recKey !== 'none') {
                            const recMap = {
                                strong_buy: ['Strong Buy', 'buy'], buy: ['Buy', 'buy'],
                                hold: ['Hold', 'hold'],
                                sell: ['Sell', 'sell'], strong_sell: ['Strong Sell', 'sell'],
                                underperform: ['Sell', 'sell'], outperform: ['Buy', 'buy']
                            };
                            const [label, cls] = recMap[recKey] || [null, null];
                            if (label) riskParts.push(`<span class="fund-label">Rec</span> <span class="fund-rec ${cls}">${label}</span>`);
                        }
                        if (riskParts.length > 0) riskEl.innerHTML = riskParts.join(' · ');
                    }

                    const earningsPanelEl = document.getElementById(`earningspanel-${_sid}`);
                    if (earningsPanelEl) {
                        const finChart = result?.earnings?.financialsChart;
                        const qRev = finChart?.quarterly?.length ? finChart.quarterly[finChart.quarterly.length - 1] : null;
                        const yRev = finChart?.yearly?.length ? finChart.yearly[finChart.yearly.length - 1] : null;

                        let qRevVal = qRev?.revenue?.raw ?? null;
                        let qRevLabel = qRev ? fiscalQuarterLabel(qRev.date) : null;
                        let yRevVal = yRev?.revenue?.raw ?? null;
                        let yRevLabel = yRev ? `FY'${String(yRev.date).slice(-2)}` : null;

                        if (qRevVal == null && yRevVal == null) {
                            const fallback = await fetchRevenueTimeseries(stock);
                            if (fallback) {
                                if (fallback.qRevVal != null) { qRevVal = fallback.qRevVal; qRevLabel = quarterLabelFromDate(fallback.qRevDate); }
                                if (fallback.yRevVal != null) { yRevVal = fallback.yRevVal; yRevLabel = `FY'${fallback.yRevDate.slice(2, 4)}`; }
                            }
                        }

                        const epsQuarters = (result?.earnings?.earningsChart?.quarterly || []).filter(q => q?.actual?.raw != null);
                        const lastEps = epsQuarters.length ? epsQuarters[epsQuarters.length - 1] : null;

                        const row1 = [];
                        if (qRevVal != null) row1.push(`<span class="eq-label">${qRevLabel} Rev:</span> <span class="eq-value">${formatCompactRevenue(qRevVal)}</span>`);
                        if (lastEps?.actual?.raw != null) {
                            const surprise = parseFloat(lastEps.surprisePct);
                            const surpriseTxt = !isNaN(surprise)
                                ? ` <span class="${surprise >= 0 ? 'eq-pos' : 'eq-neg'}">(${surprise >= 0 ? '+' : ''}${surprise.toFixed(1)}%)</span>`
                                : '';
                            row1.push(`<span class="eq-label">${fiscalQuarterLabel(lastEps.date)} EPS:</span> <span class="eq-value">${fmtPrice(stock, lastEps.actual.raw)}</span>${surpriseTxt}`);
                        }

                        const calEarn = result?.calendarEvents?.earnings;
                        const nextEpsEst = calEarn?.earningsAverage?.raw;
                        const nextRevEst = calEarn?.revenueAverage?.raw;
                        const nextQLabel = (lastEps ? nextFiscalQuarterLabel(lastEps.date) : null) || 'Next Q';
                        const row2 = [];
                        if (nextEpsEst != null || nextRevEst != null) {
                            const bits = [];
                            if (nextEpsEst != null) bits.push(`<span class="eq-label">EPS</span> <span class="eq-value">${fmtPrice(stock, nextEpsEst)}</span>`);
                            if (nextRevEst != null) bits.push(`<span class="eq-label">Rev</span> <span class="eq-value">${formatCompactRevenue(nextRevEst)}</span>`);
                            row2.push(`<span class="eq-label">${nextQLabel} Est:</span> ${bits.join(' · ')}`);
                        }
                        if (yRevVal != null) row2.push(`<span class="eq-label">${yRevLabel}:</span> <span class="eq-value">${formatCompactRevenue(yRevVal)}</span>`);

                        const lines = [];
                        if (row1.length) lines.push(row1.join(' · '));
                        if (row2.length) lines.push(row2.join(' · '));
                        earningsPanelEl.innerHTML = lines.map(l => `<div class="eq-row">${l}</div>`).join('');
                    }
                    break;
                } catch(e) {
                    if (attempt === 0) await new Promise(r => setTimeout(r, 1500));
                }
            }
        }));
    }

    function formatVolume(v) {
        if (v >= 1e9) return `${(v/1e9).toFixed(1)}B`;
        if (v >= 1e6) return `${(v/1e6).toFixed(1)}M`;
        if (v >= 1e3) return `${(v/1e3).toFixed(0)}K`;
        return v.toFixed(0);
    }

    function displayVolume(ticker, vol) {
        const stock = STOCKS.find(s => s.ticker === ticker);
        const _sid = stock ? sid(stock) : ticker;
        const el = document.getElementById(`vol-${_sid}`);
        const metaEl = document.getElementById(`meta-${_sid}`);
        if (!el || !metaEl) return;
        el.textContent = `Vol: ${formatVolume(vol)}`;
        metaEl.classList.add('has-volume');
    }

    function displayAvgVolume(ticker, avgVol) {
        const stock = STOCKS.find(s => s.ticker === ticker);
        const _sid = stock ? sid(stock) : ticker;
        const el = document.getElementById(`avgvol-${_sid}`);
        if (!el) return;
        el.textContent = `Avg Vol: ${formatVolume(avgVol)}`;
    }

    // Indian-convention currency formatter: ₹ Lakh Crore (≥1e12), ₹ Crore (≥1e7), else raw ₹.
    function formatINR(val) {
        if (val >= 1e12) return `₹${(val / 1e12).toFixed(2)}L Cr`;
        if (val >= 1e7) return `₹${Math.round(val / 1e7).toLocaleString()} Cr`;
        return `₹${Math.round(val).toLocaleString()}`;
    }

    function displayMarketCap(ticker, mcap) {
        const stock = STOCKS.find(s => s.ticker === ticker);
        const _sid = stock ? sid(stock) : ticker;
        const el = document.getElementById(`mcap-${_sid}`);
        if (!el) return;
        el.textContent = `Mkt Cap: ${formatINR(mcap)}`;
    }

    function updateMarketCap(ticker) {
        const st = state[ticker];
        const ms = getIndiaMarketStatus();
        let price;
        if (ms === 'market') {
            price = st.prevPrice || st.price;
        } else {
            price = st.sessionClose || st.prevPrice || st.price;
        }
        if (!st.shares || !price) return;
        const mcap = price * st.shares;
        st.mcap = mcap;
        displayMarketCap(ticker, mcap);
        updateTotalMarketCap();
    }

    // ─── Total Market Cap Aggregation ────────────────────────────────────────
    function updateTotalMarketCap() {
        let totalCurrent = 0, totalPrev = 0;
        let hasAny = false;
        for (const stock of STOCKS) {
            const st = state[stock.ticker];
            if (!st.shares) continue;
            const ms = getIndiaMarketStatus();
            let price, prevPrice;
            if (ms === 'market') {
                price = st.prevPrice || st.price;
                prevPrice = st.prevClose;
            } else {
                price = st.sessionClose || st.prevPrice || st.price;
                prevPrice = st.prevClose;
            }
            if (!price || !prevPrice) continue;
            hasAny = true;
            totalCurrent += price * st.shares;
            totalPrev += prevPrice * st.shares;
        }
        if (!hasAny) return;
        const valEl = document.getElementById('mcap-total-in');
        const chgEl = document.getElementById('mcap-chg-in');
        if (!valEl || !chgEl) return;
        valEl.textContent = formatINR(totalCurrent);
        if (totalPrev > 0) {
            const pctChg = ((totalCurrent - totalPrev) / totalPrev) * 100;
            const sign = pctChg >= 0 ? '+' : '';
            chgEl.innerHTML = `<span class="mcap-prev-ref">Last Close: ${formatINR(totalPrev)}</span> <span class="${pctChg >= 0 ? 'up' : 'down'}">${sign}${pctChg.toFixed(2)}%</span>`;
            chgEl.className = `mcap-summary-change`;
        }
    }

    function fiscalQuarterLabel(dateStr) {
        const m = /^(\d)Q(\d{4})$/.exec(String(dateStr));
        if (!m) return String(dateStr);
        return `Q${m[1]}'${m[2].slice(2)}`;
    }

    function nextFiscalQuarterLabel(dateStr) {
        const m = /^(\d)Q(\d{4})$/.exec(String(dateStr));
        if (!m) return null;
        let q = parseInt(m[1], 10) + 1;
        let y = parseInt(m[2], 10);
        if (q > 4) { q = 1; y += 1; }
        return `Q${q}'${String(y).slice(2)}`;
    }

    function quarterLabelFromDate(dateStr) {
        const [y, m] = String(dateStr).split('-').map(Number);
        if (!y || !m) return String(dateStr);
        return `Q${Math.ceil(m / 3)}'${String(y).slice(2)}`;
    }

    function formatCompactRevenue(val) {
        return formatINR(val);
    }

    async function fetchRevenueTimeseries(stock) {
        try {
            const url = `https://query2.finance.yahoo.com/ws/fundamentals-timeseries/v1/finance/timeseries/${stock.ticker}?type=quarterlyTotalRevenue,annualTotalRevenue`;
            const json = await yahooFetch(url);
            const results = json?.timeseries?.result || [];
            const qSeries = (results.find(r => r?.meta?.type?.[0] === 'quarterlyTotalRevenue')?.quarterlyTotalRevenue || []).filter(Boolean);
            const aSeries = (results.find(r => r?.meta?.type?.[0] === 'annualTotalRevenue')?.annualTotalRevenue || []).filter(Boolean);
            const lastQ = qSeries[qSeries.length - 1];
            const lastA = aSeries[aSeries.length - 1];
            return {
                qRevVal: lastQ?.reportedValue?.raw ?? null,
                qRevDate: lastQ?.asOfDate ?? null,
                yRevVal: lastA?.reportedValue?.raw ?? null,
                yRevDate: lastA?.asOfDate ?? null,
            };
        } catch (e) {
            return null;
        }
    }

    // ─── 52-Week High/Low ────────────────────────────────────────────────────
    // ─── Weekly Performance Readout (M T W T F) ─────────────────────────────
    const WEEK_DAY_LETTERS = ['M', 'T', 'W', 'T', 'F'];
    const INDIA_MARKET_OPEN_MINS = 555; // 9:15 AM IST

    function dateStrInTz(date, tz) {
        const s = date.toLocaleString('en-US', { timeZone: tz, hour12: false });
        const d = new Date(s);
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    // Returns a UTC-midnight Date for the Monday of the week containing the given 'YYYY-MM-DD' string.
    function mondayOfWeek(dateStr) {
        const [y, m, d] = dateStr.split('-').map(Number);
        const dt = new Date(Date.UTC(y, m - 1, d));
        const offset = (dt.getUTCDay() + 6) % 7; // days since Monday
        dt.setUTCDate(dt.getUTCDate() - offset);
        return dt;
    }

    function utcDateStr(dt) {
        return `${dt.getUTCFullYear()}-${String(dt.getUTCMonth() + 1).padStart(2, '0')}-${String(dt.getUTCDate()).padStart(2, '0')}`;
    }

    async function fetchWeekForStock(stock) {
        try {
            const url = `${YAHOO_BASE}${stock.ticker}?interval=1d&range=1mo`;
            const json = await yahooFetch(url);
            const result = json.chart.result[0];
            const quote = result.indicators.quote[0];
            const timestamps = result.timestamp || [];

            const closes = new Map();
            for (let i = 0; i < timestamps.length; i++) {
                const c = quote.close[i];
                if (c != null) closes.set(dateStrInTz(new Date(timestamps[i] * 1000), 'Asia/Kolkata'), c);
            }
            state[stock.ticker].weekCloses = closes;
            renderWeekReadout(stock);
        } catch (e) {}
    }

    // Renders the current week's M/T/W/T/F readout from cached daily closes plus the live
    // price (for today), so it updates in real time without an extra network fetch per tick.
    function renderWeekReadout(stock) {
        const st = state[stock.ticker];
        const closes = st.weekCloses;
        const weekEl = document.getElementById(`week-${sid(stock)}`);
        if (!weekEl) return;
        if (!closes) { weekEl.innerHTML = ''; return; }

        const todayStr = dateStrInTz(new Date(), 'Asia/Kolkata');
        const monday = mondayOfWeek(todayStr);
        const sortedDates = Array.from(closes.keys()).sort();

        // getIndiaMarketStatus() only distinguishes 'market'/'closed' (no premarket state),
        // so use the IST clock directly to tell "not yet open today" apart from "closed after hours".
        const istNow = new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Kolkata', hour12: false }));
        const beforeOpenToday = (istNow.getHours() * 60 + istNow.getMinutes()) < INDIA_MARKET_OPEN_MINS;

        const cells = WEEK_DAY_LETTERS.map((letter, i) => {
            const dt = new Date(monday);
            dt.setUTCDate(dt.getUTCDate() + i);
            const dateStr = utcDateStr(dt);

            let cls = 'grey', title = 'No data';
            if (dateStr > todayStr) {
                title = 'Market not yet open';
            } else if (INDIA_MARKET_HOLIDAYS.has(dateStr)) {
                title = INDIA_MARKET_HOLIDAYS.get(dateStr);
            } else if (dateStr === todayStr && beforeOpenToday) {
                title = 'Market not yet open';
            } else if (dateStr === todayStr) {
                const priorDate = sortedDates.filter(d => d < dateStr).pop();
                const prevClose = st.prevClose ?? (priorDate ? closes.get(priorDate) : null);
                const curPrice = st.price ?? closes.get(dateStr);
                if (curPrice != null && prevClose != null) {
                    cls = curPrice >= prevClose ? 'up' : 'down';
                    title = `${fmtPrice(stock, curPrice)} vs prev close ${fmtPrice(stock, prevClose)}`;
                }
            } else {
                const idx = sortedDates.indexOf(dateStr);
                if (idx > 0) {
                    const close = closes.get(dateStr);
                    const prevClose = closes.get(sortedDates[idx - 1]);
                    if (close != null && prevClose != null) {
                        cls = close >= prevClose ? 'up' : 'down';
                        title = `${fmtPrice(stock, close)} vs prev close ${fmtPrice(stock, prevClose)}`;
                    }
                }
            }

            return `<span class="week-day-letter ${cls}" title="${title}">${letter}</span>`;
        }).join('');

        weekEl.innerHTML = cells;
    }

    async function fetchAllWeek() {
        await Promise.allSettled(STOCKS.map(s => fetchWeekForStock(s)));
    }

    async function fetchATHForStock(stock) {
        try {
            const url = `${YAHOO_BASE}${stock.ticker}?interval=1d&range=1y`;
            const json = await yahooFetch(url);
            const result = json.chart.result[0];
            const quote = result.indicators.quote[0];
            const timestamps = result.timestamp || [];

            let highClose = -Infinity, highTrade = -Infinity;
            let highCloseDate = null, highTradeDate = null;
            let lowClose = Infinity, lowTrade = Infinity;
            let lowCloseDate = null, lowTradeDate = null;

            const ms = getIndiaMarketStatus();
            const marketOpen = (ms === 'market');
            const closeLimit = (marketOpen && timestamps.length > 1) ? timestamps.length - 1 : timestamps.length;
            for (let i = 0; i < closeLimit; i++) {
                const c = quote.close[i];
                if (c != null && c > highClose) { highClose = c; highCloseDate = timestamps[i]; }
                if (c != null && c < lowClose) { lowClose = c; lowCloseDate = timestamps[i]; }
            }
            for (let i = 0; i < timestamps.length; i++) {
                const h = quote.high[i];
                const l = quote.low[i];
                if (h != null && h > highTrade) { highTrade = h; highTradeDate = timestamps[i]; }
                if (l != null && l < lowTrade) { lowTrade = l; lowTradeDate = timestamps[i]; }
            }

            if (highClose <= 0) return;

            const _sid = sid(stock);
            const athEl = document.getElementById(`ath-${_sid}`);
            if (!athEl) return;

            const fmtDate = (ts) => { const d = new Date(ts * 1000); const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']; return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`; };
            const fmtP = (p) => fmtPrice(stock, p);
            const curPrice = state[stock.ticker].price;
            const pctFromHighTrade = curPrice ? ((curPrice - highTrade) / highTrade * 100).toFixed(1) : null;
            const pctFromLowTrade = curPrice ? ((curPrice - lowTrade) / lowTrade * 100).toFixed(1) : null;
            const pctHtml = (pct) => pct !== null ? ` <span class="ath-pct">(${Number(pct) >= 0 ? '+' : ''}${pct}%)</span>` : '';
            athEl.innerHTML =
                `<span class="ath-label">52W:</span> <span class="ath-value">${fmtP(lowTrade)}</span>${pctHtml(pctFromLowTrade)} – <span class="ath-value">${fmtP(highTrade)}</span>${pctHtml(pctFromHighTrade)}`;
            athEl.title =
                `52W High Close: ${fmtP(highClose)} on ${fmtDate(highCloseDate)}\n` +
                `52W High Trade: ${fmtP(highTrade)} on ${fmtDate(highTradeDate)}\n` +
                `52W Low Close: ${fmtP(lowClose)} on ${fmtDate(lowCloseDate)}\n` +
                `52W Low Trade: ${fmtP(lowTrade)} on ${fmtDate(lowTradeDate)}`;
        } catch (e) {}
    }

    async function fetchAllATH() {
        await Promise.allSettled(STOCKS.map(s => fetchATHForStock(s)));
    }

    // ─── Init ───────────────────────────────────────────────────────────────
    async function init() {
        renderGrid();
        attachChartHoverHandlers();

        if (window.innerWidth <= 640) {
            document.querySelectorAll('.stock-card').forEach(c => {
                c.classList.add('collapsed');
                const btn = c.querySelector('.collapse-toggle');
                if (btn) btn.textContent = '+';
            });
            const btn = document.getElementById('collapse-btn-in');
            if (btn) btn.textContent = '+';
        }

        initYahooProto();
        connectYahooWs();
        fetchNiftyIndex();
        setInterval(fetchNiftyIndex, 60000);
        fetchSensexIndex();
        setInterval(fetchSensexIndex, 60000);
        loadReasonsData();
        fetchAllIndia().then(() => {
            fetchAllShares();
            fetchAllATH();
            fetchAllWeek();
        });

        setInterval(() => {
            updateDimState();
            updateSentimentVisibility();
            updateEarningsCountdowns();
        }, 60000);
        updateDimState();
        updateHolidayBanner();
        updateSentimentVisibility();
        updateEarningsCountdowns();

        // Refresh every 30s (NSE has a single continuous session, no pre/post market)
        setInterval(fetchAllIndia, 30000);
    }

    function updateDimState() {
        const ms = getIndiaMarketStatus();
        STOCKS.forEach(s => {
            const _sid = sid(s);
            const card = document.getElementById(`card-${_sid}`);
            if (!card) return;
            const nasBl = card.querySelector('.nasdaq-block');
            const dim = (ms !== 'market');
            if (nasBl) nasBl.classList.toggle('nasdaq-dimmed', dim);
            const ohlEl = document.getElementById(`ohl-${_sid}`);
            if (ohlEl) ohlEl.classList.toggle('ohl-dimmed', dim);
        });
    }

    // ─── Collapse/Expand ────────────────────────────────────────────────
    function toggleCard(btn) {
        const card = btn.closest('.stock-card');
        const collapsed = card.classList.toggle('collapsed');
        btn.textContent = collapsed ? '+' : '−';
    }

    function toggleAllCards() {
        const grid = document.getElementById('stock-grid-in');
        const cards = grid.querySelectorAll('.stock-card');
        const colBtn = document.getElementById('collapse-btn-in');
        const shouldCollapse = colBtn ? colBtn.textContent.trim() === '−' : true;
        cards.forEach(c => {
            c.classList.toggle('collapsed', shouldCollapse);
            const btn = c.querySelector('.collapse-toggle');
            if (btn) btn.textContent = shouldCollapse ? '+' : '−';
        });
        if (colBtn) colBtn.textContent = shouldCollapse ? '+' : '−';
    }

    document.addEventListener('DOMContentLoaded', init);
    </script>
